<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip-Karte: Orientierung geben</title>
<style>
  :root {
    --card-w: 285px;
    --card-h: 278px;
    --ink: #141a2e;
    --ink-soft: #1e2c42;
    --accent: #9cc5df;
    --paper: #fdfdfd;
    --flip-duration: 0.7s;
  }

  /* Für die Einbettung in SharePoint optimiert: transparenter Hintergrund, kein Vollbild */
  body {
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    background: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Flip-Karte ---------- */
  .flip-card {
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1000px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .flip-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 6px;
    border-radius: 14px;
  }

  .flip-card__inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip-duration) cubic-bezier(.4, .2, .2, 1);
  }

  /* Vertikal umdrehen (um die horizontale Achse) */
  .flip-card.is-flipped .flip-card__inner {
    transform: rotateX(180deg);
  }

  .flip-card__face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: var(--paper);
    box-shadow: 0 2px 6px rgba(20, 26, 46, .08), 0 10px 24px rgba(20, 26, 46, .06);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .flip-card__face--front img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .flip-card__face--back {
    transform: rotateX(180deg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 28px 26px;
    box-sizing: border-box;
    text-align: center;
  }

  .flip-card__face--back p {
    margin: 0;
    color: var(--ink);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.35;
  }

  .flip-card__divider {
    width: 54px;
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
  }

  @media (prefers-reduced-motion: reduce) {
    .flip-card__inner { transition-duration: 0.01s; }
  }
</style>
</head>
<body>
