<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Führungsdimensionen</title>
<style>
  :root {
    --card-w: 280px;
    --card-h: 270px;
    --gap: 20px;
    --ink: #141a2e;
    --paper: #fdfdfd;
    --flip-duration: 0.7s;
  }

  /* Für die Einbettung in SharePoint: transparent, ohne Scrollbalken */
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .flip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, var(--card-w));
    gap: var(--gap);
    justify-content: center;
  }

  .flip-card {
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1000px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .flip-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
    border-radius: 14px;
  }

  .flip-card__inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip-duration) cubic-bezier(.4, .2, .2, 1);
  }

  /* Vertikal umdrehen (um die horizontale Achse) */
  .flip-card.is-flipped .flip-card__inner {
    transform: rotateX(180deg);
  }

  .flip-card__face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid #e6e9ee;
    box-shadow: 0 2px 6px rgba(20, 26, 46, .06);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .flip-card__face--front img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .flip-card__face--back {
    transform: rotateX(180deg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 24px 22px;
    box-sizing: border-box;
    text-align: center;
  }

  .flip-card__face--back p {
    margin: 0;
    color: var(--ink);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
  }

  .flip-card__divider {
    width: 54px;
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .flip-card__inner { transition-duration: 0.01s; }
  }
</style>
</head>

<script>
  document.querySelectorAll('.flip-card').forEach(card => {
    const back = card.querySelector('.flip-card__face--back');
    card.addEventListener('click', () => {
      const flipped = card.classList.toggle('is-flipped');
      card.setAttribute('aria-pressed', String(flipped));
      back.setAttribute('aria-hidden', String(!flipped));
    });
  });
