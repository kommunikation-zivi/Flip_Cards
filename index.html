<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Führungsprinzipien</title>
<style>
  :root {
    --card-w: 280px;
    --card-h: 300px;
    --gap: 20px;
    --ink: #16203a;
    --ink-soft: #4a5468;
    --line: #e4e8ee;
    --paper: #ffffff;
    /* Ebenen-Farben wie in der Tabelle */
    --alle-bg: #dff3e1;   --alle-ink: #24653a;
    --fuehr-bg: #deeaf8;  --fuehr-ink: #1f4f86;
    --flip-duration: 0.7s;
  }

  /* Für die Einbettung in SharePoint: transparent, ohne Scrollbalken */
  body {
    margin: 0;
    padding: 10px;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--ink);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, var(--card-w));
    gap: var(--gap);
    justify-content: center;
  }

  .card {
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1100px;
    border: 0;
    padding: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: center;
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 14px; }

  .card__inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform var(--flip-duration) cubic-bezier(.4, .2, .2, 1);
  }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 14px;
    box-sizing: border-box;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(22, 32, 58, .06);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .face--b { transform: rotateX(180deg); }

  /* ---------- Vorderseite ---------- */
  .front__icon {
    height: 112px;
    max-width: 200px;
    object-fit: contain;
    mix-blend-mode: multiply;
    margin-top: 4px;
  }
  .front__title {
    margin: 14px 0 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.25;
    text-wrap: balance;
  }
  .divider {
    width: 54px; height: 4px; border-radius: 2px;
    background: var(--accent);
    margin: 10px 0;
    flex-shrink: 0;
  }
  .front__keys { margin: 0; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

  /* ---------- Rückseiten ---------- */
  .level {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: .01em;
  }
  /* Etiketten in einem hellen Ton der Kachelfarbe, auf beiden Ebenen gleich */
  .level--alle,
  .level--fuehr { background: color-mix(in srgb, var(--accent) 40%, white); color: var(--ink); }

  .back__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .back__body p {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    text-wrap: balance;
  }

  /* ---------- Fusszeile: Punkte + Klick-Hinweis ---------- */
  .foot {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .dots { display: flex; gap: 6px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #cfd5de;
  }
  .dots i.on { background: var(--ink); }

  .hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .hint svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--ink); }
  .card:hover .hint { color: var(--ink); }

  /* Kleines "Antippen" der Hand, damit der Hinweis auffällt */
  @keyframes tap {
    0%, 70%, 100% { transform: translateY(0); }
    80% { transform: translateY(2px) scale(.94); }
  }
  .hint svg { animation: tap 2.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .card__inner { transition-duration: 0.01s; }
    .hint svg { animation: none; }
  }
</style>

//2Q=="
 }
];

  const LEVELS = ['Übersicht', 'Für alle', 'Zusätzlich in Führungssituationen'];

  // Hand-Icon für den Klick-Hinweis
  const HAND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 13V4.5a1.5 1.5 0 0 1 3 0V12"/>
    <path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"/>
    <path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"/>
    <path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7l-.2-.3c-.3-.5-1.4-2.4-3.3-5.7a1.5 1.5 0 0 1 .5-2a1.9 1.9 0 0 1 2.3.3L8 13"/>
    <path d="M5 3 4 2M4 7H3M14 3l1-1M15 6h1M9.5 1v0"/>
  </svg>`;

  const HINTS = [
    'Klicken: Für alle',
    'Weiter: In Führungssituationen',
    'Zurück zur Übersicht'
  ];

  function dots(step) {
    return `<div class="dots">${[0,1,2].map(i => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>`;
  }

  function foot(step) {
    return `<div class="foot">${dots(step)}<div class="hint">${HAND}<span>${HINTS[step]}</span></div></div>`;
  }

  // Alle Hände tippen im gleichen Takt: Jede neu gezeichnete Hand
  // bekommt denselben Startzeitpunkt wie alle anderen.
  function syncTap(el) {
    el.querySelectorAll('.hint svg').forEach(svg =>
      svg.getAnimations().forEach(a => { a.startTime = 0; }));
  }

  function render(d, step) {
    if (step === 0) {
      return `
        <img class="front__icon" src="${d.icon}" alt="">
        <h2 class="front__title">${d.title}</h2>
        <span class="divider"></span>
        <p class="front__keys">${d.keys}</p>
        ${foot(0)}`;
    }
    const isAlle = step === 1;
    const [a, b] = isAlle ? d.alle : d.fuehrung;
    return `
      <span class="level ${isAlle ? 'level--alle' : 'level--fuehr'}">${LEVELS[step]}</span>
      <div class="back__body">
        <p>${a}</p>
        <span class="divider"></span>
        <p>${b}</p>
      </div>
      ${foot(step)}`;
  }

  const grid = document.getElementById('grid');

  DIMENSIONS.forEach(d => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.style.setProperty('--accent', d.accent);
    card.innerHTML = `<div class="card__inner">
        <div class="face face--a"></div>
        <div class="face face--b" aria-hidden="true"></div>
      </div>`;

    const inner = card.querySelector('.card__inner');
    const faces = [card.querySelector('.face--a'), card.querySelector('.face--b')];
    let turns = 0; // Anzahl Drehungen; gerade = Seite A sichtbar

    const label = step => `${d.title} – ${LEVELS[step]}. ${HINTS[step]}`;

    faces[0].innerHTML = render(d, 0);
    card.setAttribute('aria-label', label(0));

    card.addEventListener('click', () => {
      turns++;
      const step = turns % 3;
      const showing = faces[turns % 2];
      const hiding  = faces[(turns + 1) % 2];
      showing.innerHTML = render(d, step);   // Inhalt der Rückseite vor dem Drehen setzen
      syncTap(showing);
      showing.removeAttribute('aria-hidden');
      hiding.setAttribute('aria-hidden', 'true');
      inner.style.transform = `rotateX(${turns * 180}deg)`;
      card.setAttribute('aria-label', label(step));
    });

    grid.appendChild(card);
    syncTap(faces[0]);
  });
</script>
